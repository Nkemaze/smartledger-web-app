<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Manrope:wght@100..900&display=swap" rel="stylesheet"/></head><body class="bg-surface font-body-md text-on-surface"><main class="min-h-screen flex items-center justify-center p-md"><div class="flex flex-col w-full max-w-container-max mx-auto items-center justify-center">

<div class="absolute top-[20%] -right-[5%] w-[30%] h-[30%] rounded-full bg-secondary/5 blur-[100px]"></div>
</div>
<!-- Main Login Card Container -->
<div class="relative z-10 w-full max-w-[440px] px-gutter">
<div class="bg-surface-container-lowest shadow-xl rounded-xl p-xl flex flex-col items-center">
<!-- Logo Section -->
<div class="mb-xl">
<img alt="SmartLedger Logo" class="w-16 h-16 object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLtrnq-cGmxXS6x13x1HUlAltCtFT8DnScMQVTl3ZiWSHuF-LA70cru8w-ycC6VUKxlueWs6AVKjbALo7iqYeggsVxH-ktP8uw46sZ6SxQTmpr_S3y6WaYJck9j7KpWq2-VUQzjKCxt0hKBbkUBZmAr9AmkYFH8R01kP5cH8W_agCtFw3AbZaULQzqDgmJ1GOX4SqbKScxAuxP_K0xSfT-xL1XZo4yA6AdcM1z8WmLI7Cp7769AaHsiMidc"/>
</div>
<!-- Header Section -->
<div class="text-center mb-xl">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-xs">Welcome back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to manage your store</p>
</div>
<!-- Social Logins -->
<div class="w-full flex gap-md mb-xl">
<button class="flex-1 flex items-center justify-center gap-sm py-md px-lg bg-surface-container rounded-lg hover:bg-surface-container-high transition-colors duration-200 group">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="font-label-md text-label-md text-on-surface">Google</span>
</button>
<button class="flex-1 flex items-center justify-center gap-sm py-md px-lg bg-surface-container rounded-lg hover:bg-surface-container-high transition-colors duration-200 group">
<svg class="w-5 h-5 fill-on-surface" viewbox="0 0 24 24">
<path d="M17.05 20.28c-.96 0-2.04-.6-3.23-.6-1.16 0-2.23.59-3.13.59-.88 0-1.74-.43-2.52-1.57C6.55 16.29 5.31 12.31 6.8 9.72c.74-1.29 2.08-2.11 3.53-2.13 1.1 0 2.13.76 2.81.76.66 0 1.93-.91 3.24-.77.55.02 2.1.22 3.09 1.67-.08.05-1.85 1.08-1.83 3.21.02 2.54 2.21 3.43 2.23 3.44-.02.05-.35 1.2-1.2 2.45-.73 1.07-1.49 2.13-2.62 2.13zm-3.56-13.91c-.02-2.73 2.26-5.04 2.26-5.04s2.39.04 4.54 2.6c0 0-2.2 4.95-4.53 5.04 0 0-2.25-.09-2.27-2.6z"></path>
</svg>
<span class="font-label-md text-label-md text-on-surface">Apple</span>
</button>
</div>
<!-- Divider -->
<div class="w-full flex items-center gap-md mb-xl">
<div class="h-px flex-1 bg-outline-variant/30"></div>
<span class="font-label-sm text-label-sm text-outline uppercase tracking-widest">Or continue with email</span>
<div class="h-px flex-1 bg-outline-variant/30"></div>
</div>
<!-- Form Section -->
<form class="w-full space-y-lg" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="email">Email Address</label>
<div class="relative group">
<input class="w-full h-11 px-md bg-surface border-l-2 border-l-transparent focus:border-l-primary outline-none transition-all duration-200 placeholder:text-outline/50 rounded-md font-body-md text-on-surface" id="email" name="email" placeholder="name@store.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center px-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#">Forgot password?</a>
</div>
<div class="relative group">
<input class="w-full h-11 px-md bg-surface border-l-2 border-l-transparent focus:border-l-primary outline-none transition-all duration-200 placeholder:text-outline/50 rounded-md font-body-md text-on-surface" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-sm px-1">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary/20" id="remember" type="checkbox"/>
<label class="font-label-sm text-label-sm text-on-surface-variant cursor-pointer" for="remember">Remember this device</label>
</div>
<!-- Sign In Button -->
<button class="w-full h-11 bg-primary hover:bg-primary-container text-on-primary font-title-lg text-title-lg rounded-md shadow-md hover:shadow-lg transform active:scale-[0.98] transition-all duration-200 mt-xl">
                    Sign In
                </button>
</form>
<!-- Footer Section -->
<p class="mt-xl font-body-md text-body-md text-on-surface-variant">
                Don't have an account? 
                <a class="text-primary font-label-md hover:underline decoration-2 underline-offset-4" href="#">Sign up for free</a>
</p>
</div>
<!-- Meta Footer Info -->
<div class="mt-xl flex flex-wrap justify-center gap-xl opacity-60">
<span class="font-label-sm text-label-sm text-on-surface-variant">Privacy Policy</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Terms of Service</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">© 2024 SmartLedger Inc.</span>
</div>
</div>
</div>
<script>
    // Subtle focus animations and form handling
    document.querySelectorAll('input').forEach(input => {
        input.addEventListener('focus', () => {
            input.parentElement.classList.add('shadow-sm');
        });
        input.addEventListener('blur', () => {
            input.parentElement.classList.remove('shadow-sm');
        });
    });

    // Password Visibility Toggle
    const toggleBtn = document.querySelector('button .material-symbols-outlined');
    if (toggleBtn) {
        toggleBtn.addEventListener('click', function() {
            const input = this.closest('div').querySelector('input');
            if (input.type === 'password') {
                input.type = 'text';
                this.innerText = 'visibility_off';
            } else {
                input.type = 'password';
                this.innerText = 'visibility';
            }
        });
    }
</script></main></body></html>
